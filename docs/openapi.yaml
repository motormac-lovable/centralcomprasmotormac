openapi: 3.0.3
info:
  title: API Central de Compras Motormac
  description: >
    Contrato REST consumido pela aplicação quando VITE_DATA_BACKEND=rest.
    Implementação a cargo da TI sobre o banco corporativo (ver docs/schema_oracle.sql).
    Toda a autenticação é via JWT Bearer emitido pela API da empresa
    (login próprio, OAuth2, Active Directory ou LDAP).
  version: "1.0.0"
servers:
  - url: https://api.motormac.com.br
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      summary: Autentica usuário (JWT / AD / LDAP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string, nullable: true }
                  expires_at: { type: integer, nullable: true }
                  user: { $ref: "#/components/schemas/Usuario" }
        "401": { description: Credenciais inválidas }

  /api/auth/refresh:
    post:
      summary: Renova o token de acesso
      responses:
        "200": { description: Novo token }

  /api/auth/logout:
    post:
      summary: Encerra a sessão
      responses:
        "204": { description: Sessão encerrada }

  /api/auth/me:
    get:
      summary: Usuário autenticado (perfil + papéis)
      responses:
        "200":
          description: Usuário corrente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }

  /api/solicitacoes:
    get:
      summary: Lista solicitações (Kanban / Histórico)
      parameters:
        - { in: query, name: status, schema: { $ref: "#/components/schemas/StatusCard" } }
        - { in: query, name: requester_id, schema: { type: string } }
      responses:
        "200":
          description: Lista de solicitações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Solicitacao" }
    post:
      summary: Cria solicitação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitacaoCreate" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  codigo_unico: { type: string }

  /api/solicitacoes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Detalha uma solicitação
      responses:
        "200":
          description: Solicitação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solicitacao" }
        "404": { description: Não encontrada }
    put:
      summary: Atualiza campos da solicitação (movimentação, cotações, anexos)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Solicitacao" }
      responses:
        "200": { description: Atualizada }

  /api/solicitacoes/{id}/comprador:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Comprador vinculado à solicitação
      responses:
        "200":
          description: Comprador atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  buyer_name: { type: string, nullable: true }

  /api/solicitacoes/rodizio-comprador:
    post:
      summary: Retorna o próximo comprador do revezamento cíclico (contratos)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buyers:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Comprador sorteado pelo rodízio
          content:
            application/json:
              schema:
                type: object
                properties:
                  buyer_name: { type: string, nullable: true }

  /api/mensagens:
    get:
      summary: Lista mensagens de uma solicitação
      parameters:
        - { in: query, name: card_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Mensagens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mensagem" }
    post:
      summary: Envia mensagem no chat da solicitação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mensagem" }
      responses:
        "201": { description: Enviada }

  /api/mensagens/marcar-lidas:
    post:
      summary: Marca mensagens recebidas como lidas
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                card_ids:
                  type: array
                  items: { type: string }
                user_id: { type: string }
      responses:
        "204": { description: Atualizado }

  /api/departamentos:
    get:
      summary: Lista departamentos
      responses:
        "200":
          description: Departamentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Departamento" }

  /api/origens:
    get:
      summary: Lista origens
      responses:
        "200":
          description: Origens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Departamento" }

  /api/usuarios:
    get:
      summary: Lista usuários / perfis
      responses:
        "200":
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Usuario" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StatusCard:
      type: string
      enum:
        - solicitacoes_abertas
        - em_cotacao
        - aguardando_aprovacao
        - cotacoes_rejeitadas
        - cotacoes_aprovadas
        - pedidos_gerados
    TipoSolicitacao:
      type: string
      enum: [compras, contratos, frete, materiais]
    Departamento:
      type: object
      properties:
        code: { type: integer }
        name: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        full_name: { type: string, nullable: true }
        roles:
          type: array
          items:
            type: string
            enum: [owner, admin, buyer, aprovador, solicitante, auditor]
    Solicitacao:
      type: object
      properties:
        id: { type: string }
        codigo_unico: { type: string, nullable: true }
        kind: { $ref: "#/components/schemas/TipoSolicitacao" }
        title: { type: string }
        summary: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/StatusCard" }
        requester_id: { type: string, nullable: true }
        requester_name: { type: string, nullable: true }
        requester_email: { type: string, nullable: true }
        unidade: { type: string, nullable: true }
        empresa: { type: string, nullable: true }
        buyer_name: { type: string, nullable: true }
        buyer_assigned_at: { type: string, format: date-time, nullable: true }
        approver_id: { type: string, nullable: true }
        approver_name: { type: string, nullable: true }
        order_number: { type: string, nullable: true }
        numero_pedido_linx: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
        observations: { type: array, items: { type: object, additionalProperties: true } }
        suppliers: { type: array, items: { type: object, additionalProperties: true } }
        attachments: { type: array, items: { type: object, additionalProperties: true } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time }
    SolicitacaoCreate:
      type: object
      required: [kind, title, data]
      properties:
        kind: { $ref: "#/components/schemas/TipoSolicitacao" }
        title: { type: string }
        summary: { type: string }
        requester_id: { type: string, nullable: true }
        requester_name: { type: string }
        requester_email: { type: string }
        unidade: { type: string }
        empresa: { type: string }
        status: { $ref: "#/components/schemas/StatusCard" }
        buyer_name: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
        observations: { type: array, items: { type: object, additionalProperties: true } }
    Mensagem:
      type: object
      properties:
        id: { type: string }
        card_id: { type: string }
        sender_id: { type: string }
        sender_name: { type: string }
        sender_email: { type: string }
        sender_phone: { type: string }
        sender_role: { type: string }
        buyer_name: { type: string, nullable: true }
        body: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
